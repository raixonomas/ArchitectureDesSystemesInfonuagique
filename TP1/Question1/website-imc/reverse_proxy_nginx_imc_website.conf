server {
	listen 80;
	server_name imc.niaksi.me; # REPLACE WITH YOUR URL 
	return 301 https://$host$request_uri;
}



server {
	listen 443 ssl;
	server_name imc.niaksi.me; # REPLACE WITH YOUR URL
	ssl_certificate /path/to/ssl/certificate; # CHANGE TO YOURS
	ssl_certificate_key /path/to/ssl/certificate/key; # CHANGE TO YOURS
	
	access_log /path/to/access.log; # CHANGE TO YOURS
    error_log /path/to/error.log; # CHANGE TO YOURS
	
	location / {
		proxy_pass http://[IP]:[PORT]; # CHANGE TO YOURS

		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;

		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_buffering off;

		proxy_read_timeout 3600s;
	}

} 

<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Calcul IMC</title>
        <style>
    body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    input {
        width: 100%;
        padding: 10px 15px;
        border: 1px solid;
        border-radius: 5px;
    }
    button {
        width: 100%;
        margin-top: 8px;
        padding: 8px;
        border: 0;
        border-radius: 5px;
        color: #000000;
        background-color: #87CEEB;
        font-weight: 600;
        cursor: pointer;
    }
        </style>
    </head>
    <body>
        <main>
            <h1>Calcul d'IMC</h1>
            <p class="sub">Indique ton poids et ta taille, puis clique sur Calculer.</p>
            <form id="form-imc">
                <label for="weight">Poids (kg)</label>
                <input id="weight" name="weight" type="number" min="1" max="500" step="0.1" required>

                <label for="height">Taille (cm)</label>
                <input id="height" name="height" type="number" min="50" max="300" step="0.1" required>

                <button type="submit">Calculer</button>
            </form>

            <p id="erreur"></p>
            <div id="resultat"></div>

            <footer>
                Formule : IMC = poids (kg) / taille (m)²
            </footer>
        </main>

        <script>
            document.getElementById("form-imc").addEventListener("submit", function (event) {
                event.preventDefault();

                const errEl = document.getElementById("erreur");
                const resEl = document.getElementById("resultat");
                errEl.style.display = "none";
                resEl.style.display = "none";

                const weight = parseFloat(document.getElementById("weight").value);
                const height = parseFloat(document.getElementById("height").value);

                if(!weight || !height || weight<=0 || height<=0){
                    erreurEl.textContent = "Merci d'entrer des valeurs valides.";
                    erreurEl.style.display = "block";
                    return;
                }

                const height_m = height / 100;
                const imc = weight / (height_m * height_m);
                const imc_round = Math.round(imc * 100)/100;

                resEl.innerHTML = "<strong>IMC = "+ imc_round + "</strong>";
                resEl.style.display = "block";
            });
        </script>
    </body>
